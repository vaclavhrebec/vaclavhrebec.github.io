<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concordantia — a topical concordance of music treatises</title>
<meta name="description" content="Music treatises organised by topic: what Boethius, Guido, Tinctoris, Ornithoparchus, Zarlino and others say on the same question, with sources and historical context.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --paper:#fffdf8; --ink:#231f1a; --muted:#6d655b; --line:#e2dacb;
  --accent:#8a2e1f; --accent-soft:#f1e1da;
  --l-treatise:#8a2e1f; --l-ms:#2f5d50; --l-sci:#3e4f86; --l-event:#8a6a1f;
  --serif:"Crimson Pro",Georgia,serif; --sans:Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16140f; --paper:#1f1c16; --ink:#ece6da; --muted:#a59c8e; --line:#3a352c;
  --accent:#e08a6f; --accent-soft:#3a2620;
  --l-treatise:#e08a6f; --l-ms:#7fbfa9; --l-sci:#9aa9e6; --l-event:#d9b764;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5}
header{padding:28px 20px 8px;max-width:1000px;margin:0 auto}
h1{font-weight:400;font-size:clamp(34px,7vw,54px);margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:17px;font-style:italic;color:var(--muted);letter-spacing:0;margin-top:2px}
.sketch{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:10px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav .in{max-width:1000px;margin:0 auto;display:flex;gap:4px;padding:8px 14px;overflow-x:auto}
nav button{font-family:var(--sans);font-size:14px;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:18px 20px 60px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.chip{font-family:var(--sans);font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.lede{color:var(--muted);font-style:italic;margin:0 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.card h3{margin:0;font-weight:600;font-size:21px;line-height:1.25}
.card h3 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.meta{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.loc{font-family:var(--sans);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-family:var(--sans);font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.links a.direct{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.grid .card{margin:0;cursor:pointer}
.grid .card:hover{border-color:var(--accent)}
input[type=search]{width:100%;font:16px var(--sans);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:12px}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:18px}
.tl .row{position:relative;margin:0 0 14px}
.tl .row::before{content:"";position:absolute;left:-25px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tl .yr{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--c)}
.tl .t{font-size:18px}
.tl .t a{color:inherit}
.tl .n{font-size:15.5px;color:var(--muted)}
.cent{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px -18px;padding-left:0}
.lane{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.back{font-family:var(--sans);font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;margin-bottom:12px}
.ctx{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0}
.conn{font-size:16px;margin:6px 0}
.conn b{font-weight:600}
.pill{font-family:var(--sans);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:4px;margin-right:4px}
.foot{font-family:var(--sans);font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:30px;padding-top:12px}
h2{font-weight:400;font-size:28px;margin:6px 0 4px}
.about p{max-width:680px}
.about li{margin-bottom:6px}
</style>
</head>

/* q = search string for the repositories; direct = verified deep links */
const T=[
 {id:"boethius",tml:["6th-8th/BOEDIM1", "6th-8th/BOEDIM2", "6th-8th/BOEDIM3", "6th-8th/BOEDIM4", "6th-8th/BOEDIM5"],author:"Boethius",title:"De institutione musica",date:"c. 500",y:500,place:"Ravenna / Rome",q:"Boethius De institutione musica",
  ctx:"Written for the Latin West at the end of antiquity; for a millennium the authority on music as a mathematical art of the quadrivium.",

 {id:"guido-micr",tml:["9th-11th/GUIMIC"],author:"Guido of Arezzo",title:"Micrologus",date:"c. 1026",y:1026,place:"Arezzo",q:"Guido Micrologus",
  ctx:"A short practical manual by the monk who also devised staff lines in his antiphoner; among the most copied medieval music books.",

 {id:"guido-ep",tml:["9th-11th/GUIEP"],author:"Guido of Arezzo",title:"Epistola de ignoto cantu",date:"c. 1030",y:1030,place:"Pomposa / Arezzo",q:"Guido Epistola de ignoto cantu",
  ctx:"A letter to the monk Michael describing Guido's method of teaching boys to sing unknown chants quickly.",

 {id:"franco",tml:["13th/FRAACM"],author:"Franco of Cologne",title:"Ars cantus mensurabilis",date:"c. 1280",y:1280,place:"Paris / Cologne",q:"Franco Ars cantus mensurabilis",
  ctx:"Codifies the notation of the Notre-Dame and motet repertory.",

 {id:"vitry",tml:["14th/VITARN"],author:"attr. Philippe de Vitry",title:"Ars nova",date:"c. 1320",y:1320,place:"Paris",q:"Vitry Ars nova",
  ctx:"Gave its name to a whole period; survives in several differing redactions.",

 {id:"jacobus",tml:["14th/JACSP1A", "14th/JACSM7"],author:"Jacobus of Liège",title:"Speculum musicae",date:"c. 1330",y:1330,place:"Liège / Paris",q:"Jacobus Speculum musicae",

 {id:"prosdocimo",tml:["15th/PROCON"],author:"Prosdocimo de' Beldomandi",title:"Contrapunctus",date:"1412",y:1412,place:"Padua",q:"Prosdocimo Contrapunctus",
  ctx:"By a Paduan professor of astronomy and mathematics.",
  says:{cpt:"Teaches note-against-note counterpoint and forbids successive perfect consonances of the same kind.",

 {id:"tinctoris",tml:["15th/TINCON1", "15th/TINCON2", "15th/TINCON3"],author:"Johannes Tinctoris",title:"Liber de arte contrapuncti",date:"1477",y:1477,place:"Naples",q:"Tinctoris Liber de arte contrapuncti",

 {id:"gaffurius",tml:["15th/GAFPM1", "15th/GAFPM2", "15th/GAFPM3", "15th/GAFPM4"],author:"Franchinus Gaffurius",title:"Practica musicae",date:"1496",y:1496,place:"Milan",q:"Gaffurius Practica musicae",

 {id:"schlick",author:"Arnolt Schlick",title:"Spiegel der Orgelmacher und Organisten",date:"1511",y:1511,place:"Speyer / Mainz",q:"Schlick Spiegel der Orgelmacher",

 {id:"virdung",author:"Sebastian Virdung",title:"Musica getutscht",date:"1511",y:1511,place:"Basel",q:"Virdung Musica getutscht",

 {id:"ornithoparchus",tml:["16th/ORNMUS1", "16th/ORNMUS2", "16th/ORNMUS3", "16th/ORNMUS4"],author:"Andreas Ornithoparchus",title:"Musicae activae micrologus",date:"1517",y:1517,place:"Leipzig",q:"Ornithoparchus Musicae activae micrologus",
  direct:[["IMSLP","https://imslp.org/wiki/Musicae_activae_micrologus_(Ornithoparchus,_Andreas)"]],

 {id:"aron",author:"Pietro Aron",title:"Toscanello in musica",date:"1523",y:1523,place:"Venice",q:"Aron Toscanello",

 {id:"ganassi",author:"Silvestro Ganassi",title:"Opera intitulata Fontegara",date:"1535",y:1535,place:"Venice",q:"Ganassi Fontegara",

const enc=encodeURIComponent;
function repoLinks(t){
  const out=(t.direct||[]).map(([l,u])=>`<a class="direct" href="${u}" target="_blank" rel="noopener">${l} ↗</a>`);
  const roman=["I","II","III","IV","V","VI","VII"];
  if(t.tml) t.tml.forEach((p,i)=>out.push(`<a class="direct" href="${TML_BASE+p}" target="_blank" rel="noopener">TML${t.tml.length>1?" "+(roman[i]||i+1):""} ↗</a>`));
  out.push(`<a href="https://imslp.org/index.php?search=${enc(t.q)}" target="_blank" rel="noopener">IMSLP search</a>`);
  out.push(`<a href="https://gallica.bnf.fr/services/engine/search/sru?operation=searchRetrieve&version=1.2&query=${enc('(gallica all "'+t.q+'")')}" target="_blank" rel="noopener">Gallica search</a>`);
  out.push(`<a href="https://www.diamm.ac.uk/search/?q=${enc(t.q)}" target="_blank" rel="noopener">DIAMM search</a>`);
  return `<div class="links">${out.join("")}</div>`;
}
const byId=id=>T.find(t=>t.id===id);
let state={cent:"all",sq:"",kind:"all",view:"topics",topic:"improv",treatise:null,lanes:new Set(Object.keys(LANES)),q:""};

const VIEWS={topics:"By topic",treatises:"Treatises",sources:"All sources",timeline:"Timeline",about:"About"};
function renderNav(){
  document.getElementById("nav").innerHTML=Object.entries(VIEWS).map(([k,v])=>
    `<button class="${state.view===k&&!state.treatise?'on':''}" data-v="${k}">${v}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;state.treatise=null;render();scrollTo(0,0)});
}
function topicView(){
  const chips=Object.entries(TOPICS).map(([k,v])=>`<button class="chip ${state.topic===k?'on':''}" data-t="${k}">${v}</button>`).join("");
  const hits=T.filter(t=>t.says[state.topic]).sort((a,b)=>a.y-b.y);
  return `<p class="lede">Choose a topic: every treatise that speaks to it appears in chronological order, with where in the work it says so.</p>
  <div class="chips">${chips}</div>
  <h2>${TOPICS[state.topic]}</h2><p class="meta">${hits.length} treatises</p>
  ${hits.map(t=>`<div class="card"><div class="loc">${t.date} · ${t.place}</div>
    <h3><a href="#" data-open="${t.id}">${t.author}, <i>${t.title}</i></a></h3>
    <p style="margin:8px 0 0">${t.says[state.topic]}</p>${repoLinks(t)}</div>`).join("")}`;
}
function treatiseList(){
  const q=state.q.toLowerCase();
  const list=T.filter(t=>!q||(t.author+t.title+t.place).toLowerCase().includes(q)).sort((a,b)=>a.y-b.y);
  return `<input type="search" id="q" placeholder="Search author, title, place…" value="${state.q}">
  <div class="grid">${list.map(t=>`<div class="card" data-open="${t.id}"><div class="loc">${t.date}</div>
    <h3>${t.title}</h3><div class="meta">${t.author} · ${t.place}</div>
    <div>${Object.keys(t.says).map(k=>`<span class="pill">${TOPICS[k]}</span>`).join(" ")}</div></div>`).join("")}</div>`;
}
function treatiseView(t){
  const conns=CONN.filter(c=>c[0]===t.id||c[1]===t.id).map(c=>{
    const other=byId(c[0]===t.id?c[1]:c[0]);
    return `<div class="conn"><span class="pill">${c[2]}</span> <a href="#" data-open="${other.id}">${other.author}, <i>${other.title}</i></a>${c[3]?` — ${c[3]}`:""}</div>`}).join("");
  const near=CONTEXT.filter(c=>Math.abs(c.y-t.y)<=12).map(c=>`<div class="conn"><span class="lane" style="--c:var(${LANES[c.lane][1]})"></span>${c.date} · ${c.title} <span style="color:var(--muted)">— ${c.n}</span></div>`).join("");
  return `<button class="back" id="back">← back</button>
  <div class="loc">${t.date} · ${t.place}</div>
  <h2><i>${t.title}</i></h2><div class="meta" style="font-size:15px">${t.author}</div>
  <div class="ctx">${t.ctx}</div>${repoLinks(t)}
  <h3 style="font-weight:400;font-size:22px;margin:24px 0 8px">What it says, by topic</h3>
  ${Object.entries(t.says).map(([k,v])=>`<div class="card"><a href="#" class="loc" data-topic="${k}" style="text-decoration:none">${TOPICS[k]} →</a><p style="margin:6px 0 0">${v}</p></div>`).join("")}
  ${conns?`<h3 style="font-weight:400;font-size:22px;margin:24px 0 8px">Connections</h3>${conns}`:""}
  ${near?`<h3 style="font-weight:400;font-size:22px;margin:24px 0 8px">Around the same time</h3>${near}`:""}`;
}

const CENTS=["3rd-5th","6th-8th","9th-11th","12th","13th","14th","15th","16th","17th"];
const workKey=o=>o.a+"|"+o.t.replace(/[,;.]?\s*(liber|book|tractatus|pars)\s+\w+\s*$/i,"").replace(/\s*\[[^\]]*\]\s*$/,"").trim();
const LINKED={};T.forEach(t=>(t.tml||[]).forEach(p=>LINKED[p.split("/")[1]]=t.id));
function sourcesView(){
  const q=state.sq.toLowerCase();
  const rows=TML.filter(o=>(state.cent==="all"||o.c===state.cent)&&(state.kind==="all"||o.k===state.kind)&&
    (!q||(o.a+" "+o.t+" "+o.s+" "+o.id).toLowerCase().includes(q)));
  const works=new Map();rows.forEach(o=>{const k=o.c+"|"+workKey(o);if(!works.has(k))works.set(k,[]);works.get(k).push(o)});
  const byAuthor=new Map();works.forEach((v,k)=>{const a=v[0].a;if(!byAuthor.has(a))byAuthor.set(a,[]);byAuthor.get(a).push(v)});
  const cc=["all",...CENTS].map(c=>`<button class="chip ${state.cent===c?'on':''}" data-cent="${c}">${c==="all"?"All centuries":c}</button>`).join("");
  const kc=[["all","All"],["text","Printed editions"],["ms","Manuscript transcriptions"]].map(([k,l])=>`<button class="chip ${state.kind===k?'on':''}" data-kind="${k}">${l}</button>`).join("");
  let body="";
  [...byAuthor.entries()].slice(0,400).forEach(([a,ws])=>{
    body+=`<div class="card"><h3>${a}</h3>`+ws.map(v=>{
      const o=v[0],cur=v.map(x=>LINKED[x.id]).find(Boolean);
      const files=v.map(x=>`<a class="${x.k==='ms'?'':'direct'}" href="${TML_BASE}${x.c}/${x.id}" target="_blank" rel="noopener" title="${x.s.replace(/"/g,'&quot;')}">${x.t===o.t&&v.length===1?x.id:x.t.replace(/^.*?[,;]?\s*(?=\b(liber|book)\b)/i,"")} ↗</a>`).join("");
      return `<div style="margin-top:10px"><div class="loc">${o.c} c.${v.some(x=>x.k==="ms")?" · MS":""}</div>
        <div><i>${workKey(o).split("|")[1]||o.t}</i>${cur?` · <a href="#" data-open="${cur}">in Concordantia →</a>`:""}</div>
        <div class="meta" style="margin:2px 0 0">${o.s}</div><div class="links" style="margin-top:6px">${files}</div></div>`}).join("")+`</div>`});
  return `<p class="lede">The whole Thesaurus Musicarum Latinarum: ${TML.length} texts, from Augustine to the 17th century, each linked to its TML page.</p>
  <input type="search" id="sq" placeholder="Search author, title, library, shelfmark…" value="${state.sq}">
  <div class="chips">${cc}</div><div class="chips" style="margin-top:-8px">${kc}</div>
  <p class="meta">${rows.length} texts · ${works.size} works · ${byAuthor.size} authors${byAuthor.size>400?" (first 400 authors shown; narrow the search)":""}</p>${body}
  <p class="meta">TML is being restored at Indiana University; links go to its provisional site for now.</p>`;
}
function timelineView(){
  const lanes=Object.entries(LANES).map(([k,[l,c]])=>`<button class="chip ${state.lanes.has(k)?'on':''}" data-lane="${k}"><span class="lane" style="--c:var(${c})"></span>${l}</button>`).join("");
  const items=[...T.map(t=>({lane:"treatise",y:t.y,date:t.date,title:`${t.author}, <i>${t.title}</i>`,n:t.place,id:t.id})),...CONTEXT]
    .filter(i=>state.lanes.has(i.lane)).sort((a,b)=>a.y-b.y);
  let html="",cent=null;
  items.forEach(i=>{const c=Math.floor(i.y/100)+1;
    if(c!==cent){cent=c;html+=`<div class="cent">${["","","","","","","6th","","","","","11th","","13th","14th","15th","16th","17th"][c]||c+"th"} century</div>`}
    html+=`<div class="row" style="--c:var(${LANES[i.lane][1]})"><div class="yr">${i.date}</div>
      <div class="t">${i.id?`<a href="#" data-open="${i.id}">${i.title}</a>`:i.title}</div><div class="n">${i.n}</div></div>`});
  return `<p class="lede">Treatises set among manuscripts, prints, science, medicine and events.</p><div class="chips">${lanes}</div><div class="tl">${html}</div>`;
}
function aboutView(){
  return `<div class="about"><h2>About Concordantia</h2>
  <p>A reference site that organises music treatises by topic, so that one can read what different authors say about the same question, each within the context of its own treatise and its own time.</p>
  <ul>
   <li><b>Texts:</b> the Thesaurus Musicarum Latinarum as the main source of Latin texts, segmented by book and chapter and tagged by topic; vernacular treatises from Gallica, IMSLP, e-rara, MDZ and other digitised collections.</li>
   <li><b>Every treatise</b> links to its digitised sources (TML, Gallica, IMSLP, DIAMM) and carries a short historical context.</li>
   <li><b>Timeline</b> of treatises next to manuscripts, prints, science, medicine and events.</li>
   <li><b>Connections</b> between treatises and people: dedications, translations, editions, polemics.</li>
   <li><b>Next:</b> real excerpts in Latin with translation beside each summary; direct links to each copy rather than searches; more topics and treatises.</li>
  </ul>
  <p style="color:var(--muted);font-size:16px">Solid-bordered links go straight to the text; the others open a search in the repository. The full TML catalogue is under All sources. Summaries are editorial and still to be checked against the sources.</p></div>`;
}
function render(){
  renderNav();
  const app=document.getElementById("app");
  if(state.treatise) app.innerHTML=treatiseView(byId(state.treatise));
  else app.innerHTML={topics:topicView,treatises:treatiseList,sources:sourcesView,timeline:timelineView,about:aboutView}[state.view]();
  app.innerHTML+=`<div class="foot">© 2026 Václav Hřebec · <a href="../" style="color:inherit">vaclavhrebec.github.io</a> · <a href="../atlas/" style="color:inherit">Atlas of Musical Style</a> · <a href="../fiorire/" style="color:inherit">Fiorire</a> · Texts and images remain with their repositories.</div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{state.topic=b.dataset.t;render()});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=e=>{e.preventDefault();state.treatise=b.dataset.open;render();scrollTo(0,0)});
  app.querySelectorAll("[data-topic]").forEach(b=>b.onclick=e=>{e.preventDefault();state.treatise=null;state.view="topics";state.topic=b.dataset.topic;render();scrollTo(0,0)});
  app.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>{const k=b.dataset.lane;state.lanes.has(k)?state.lanes.delete(k):state.lanes.add(k);render()});
  const back=document.getElementById("back"); if(back) back.onclick=()=>{state.treatise=null;render()};
  app.querySelectorAll("[data-cent]").forEach(b=>b.onclick=()=>{state.cent=b.dataset.cent;render()});
  app.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{state.kind=b.dataset.kind;render()});
  const sq=document.getElementById("sq"); if(sq){let tm;sq.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{state.sq=sq.value;render();const n=document.getElementById("sq");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}}
  const q=document.getElementById("q"); if(q){q.oninput=()=>{state.q=q.value;const p=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)}}
}
render();
</script>
