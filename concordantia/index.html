<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Concordantia — a topical concordance of music treatises</title>
<meta name="description" content="Music treatises organised in a tree of topics, from Augustine to Riemann: what each treatise says on improvisation, diminution, ornaments, basso continuo, modes, counterpoint and more, with Latin passages, folio and chapter, and links to the sources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c2a07a; --paper:#ccad8a; --ink:#1f170f; --muted:#4a3a28; --line:#a5845d;
  --accent:#8a2e1f; --accent-soft:#f1e1da;
  --l-treatise:#8a2e1f; --l-ms:#2f5d50; --l-sci:#3e4f86; --l-event:#8a6a1f;
  --serif:"Crimson Pro",Georgia,serif; --sans:Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16140f; --paper:#1f1c16; --ink:#ece6da; --muted:#a59c8e; --line:#3a352c;
  --accent:#e08a6f; --accent-soft:#3a2620;
  --l-treatise:#e08a6f; --l-ms:#7fbfa9; --l-sci:#9aa9e6; --l-event:#d9b764;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5}
a{color:var(--accent)}
header{padding:28px 20px 8px;max-width:1000px;margin:0 auto}
h1{font-weight:400;font-size:clamp(34px,7vw,54px);margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:17px;font-style:italic;color:var(--muted);letter-spacing:0;margin-top:2px}
.sketch{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:10px}
.sketch a{color:inherit}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav .in{max-width:1000px;margin:0 auto;display:flex;gap:4px;padding:8px 14px;overflow-x:auto}
nav a{font-family:var(--sans);font-size:14px;color:var(--muted);padding:8px 12px;border-radius:6px;white-space:nowrap;text-decoration:none}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:18px 20px 60px}
h2{font-weight:400;font-size:30px;margin:4px 0 2px;line-height:1.2}
h3.sec{font-weight:400;font-size:22px;margin:28px 0 8px}
.lede{color:var(--muted);font-style:italic;margin:0 0 14px}
.meta{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.loc{font-family:var(--sans);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0;font-weight:600;font-size:20px;line-height:1.25}
.card h3 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.note{margin:6px 0 0}
input[type=search]{width:100%;font:16px var(--sans);padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:8px 0 6px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font-weight:600;font-size:18px;line-height:1.25}
.tile span{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.crumbs{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.crumbs a{color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.crumbs i{font-style:normal;opacity:.6}
.aka{font-family:var(--sans);font-size:12px;color:var(--muted);margin:2px 0 6px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-family:var(--sans);font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.links a.direct{border-color:var(--accent)}
.pill{font-family:var(--sans);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:4px;text-decoration:none;display:inline-block;margin:2px 3px 2px 0}
.q{margin:10px 0 0;padding:6px 0 6px 14px;border-left:2px solid var(--line)}
.q blockquote{margin:0;font-style:italic;font-size:17px}
.q .w{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-bottom:3px}
.q .w b{color:var(--accent);font-weight:600}
.more{font-family:var(--sans);font-size:13px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:8px}
.trow{padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{font-family:var(--sans);font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:18px}
.tl .row{position:relative;margin:0 0 12px}
.tl .row::before{content:"";position:absolute;left:-25px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tl .yr{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--c)}
.tl .t a{color:inherit}
.tl .n{font-size:15.5px;color:var(--muted)}
.cent{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.lane{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.ctx{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0}
.res{display:block;text-decoration:none;color:var(--ink);padding:10px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .p{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.res b{font-weight:600}
.foot{font-family:var(--sans);font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:30px;padding-top:12px}
.foot a{color:inherit}
.about p,.about li{max-width:700px}
.about li{margin-bottom:6px}
</style>
</head>
<body>
<header>
  <h1>Concordantia<small>A topical concordance of music treatises, with their sources and their world</small></h1>
  <div class="sketch"><a href="../">← vaclavhrebec.github.io</a> · summaries are editorial paraphrase; Latin passages are quoted from the Thesaurus Musicarum Latinarum</div>
</header>
<nav><div class="in" id="nav"></div></nav>
<main id="app"></main>

<script src="tml.js"></script>
<script src="tree.js"></script>
<script>
/* ---------- data ---------- */
const NODES={}, PARENT={};
(function index(list,parent){list.forEach(n=>{NODES[n.id]=n;PARENT[n.id]=parent;index(n.c,n.id)})})(TREE,null);
const META={}; TML.forEach(o=>META[o.c+"/"+o.id]=o);
const FILE2WORK={}; Object.entries(WORKS).forEach(([id,w])=>w.tml.forEach(k=>FILE2WORK[k]=id));
const CENTS=["3rd-5th","6th-8th","9th-11th","12th","13th","14th","15th","16th","17th"];
const WORKREFS={}; Object.values(NODES).forEach(n=>n.s.forEach(([w,note])=>{(WORKREFS[w]=WORKREFS[w]||[]).push([n.id,note])}));
const LANES={treatise:["Treatise","--l-treatise"],ms:["Manuscript / print","--l-ms"],sci:["Science, medicine, letters","--l-sci"],event:["Event","--l-event"]};
const CONTEXT=[
 {lane:"ms",y:1400,date:"c. 1400",title:"Faenza Codex",n:"Keyboard intabulations of sacred and secular pieces."},
 {lane:"ms",y:1410,date:"c. 1410–15",title:"Squarcialupi Codex",n:"Illuminated anthology of Trecento music, Florence."},
 {lane:"event",y:1453,date:"1453",title:"Fall of Constantinople",n:"Greek scholars and manuscripts move west."},
 {lane:"ms",y:1460,date:"c. 1460–70",title:"Buxheim Organ Book",n:"Largest keyboard source of the 15th century."},
 {lane:"ms",y:1501,date:"1501",title:"Petrucci, Harmonice musices Odhecaton",n:"First polyphony printed with movable type, Venice."},
 {lane:"sci",y:1516,date:"1516",title:"Erasmus, Novum Instrumentum",n:"Greek New Testament printed by Froben in Basel."},
 {lane:"event",y:1517,date:"1517",title:"Luther's 95 theses",n:"The same year Ornithoparchus prints his Micrologus in Leipzig."},
 {lane:"sci",y:1543,date:"1543",title:"Vesalius, De humani corporis fabrica",n:"Anatomy, printed by Oporinus in Basel."},
 {lane:"sci",y:1543,date:"1543",title:"Copernicus, De revolutionibus",n:"Heliocentric astronomy, Nuremberg."},
 {lane:"event",y:1545,date:"1545–63",title:"Council of Trent",n:"Reform of liturgy and chant."},
 {lane:"event",y:1551,date:"1551",title:"Vicentino–Lusitano debate",n:"Public dispute in Rome on the genera of contemporary music."},
 {lane:"event",y:1600,date:"1600–07",title:"Artusi–Monteverdi controversy",n:"Seconda pratica against the rules of counterpoint."},
 {lane:"event",y:1618,date:"1618–48",title:"Thirty Years' War",n:"Devastation of German musical life; Schütz's small sacred concertos."},
 {lane:"sci",y:1687,date:"1687",title:"Newton, Principia",n:"Mathematical natural philosophy."},
 {lane:"event",y:1789,date:"1789",title:"French Revolution",n:"The Paris Conservatoire follows in 1795."}
];
const CONN=[
 ["ornithoparchus","schlick","dedication","Book IV opens with the dedication to Schlick, 'organist to the Count Palatine'."],
 ["dowland","ornithoparchus","translation","English translation, London 1609."],
 ["glarean","boethius","edition","Glarean edited Boethius' writings on music."],
 ["lusitano","vicentino","debate","Public debate on the genera, Rome 1551."],
 ["gaffurius","tinctoris","acquaintance","Gaffurius met Tinctoris in Naples."],
 ["burzio","ramos","polemic","Burzio defends Guido against Ramos."],
 ["artusi","monteverdi","polemic","Artusi's attack and the Monteverdis' reply."],
 ["buttstett","mattheson-orch","polemic","The quarrel over solmisation."],
 ["galilei","zarlino","polemic","Galilei, Zarlino's pupil, attacks his teacher."],
 ["playford","caccini","translation","An English version of Caccini's preface."],
 ["rameau-diss","campion","critique","Rameau weighs the règle de l'octave."]
];

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ß/g,"ss").replace(/æ/g,"ae").replace(/œ/g,"oe");
const enc=encodeURIComponent;
const TML_LINK=k=>TML_BASE+k;
function path(id){const p=[];while(id){p.unshift(id);id=PARENT[id]}return p}
function descendants(id){const out=[];(function d(n){n.c.forEach(c=>{out.push(c.id);d(c)})})(NODES[id]);return out}
function countSub(n){return descendants(n.id).length}
function workLine(id){const w=WORKS[id];return w?`${esc(w.a)}, <i>${esc(w.t)}</i> (${esc(w.d)})`:id}
function bookLabel(o){const m=o.t.match(/\b(liber|book|pars|partes|tractatus)\s+(primus|secundus|tertius|tercius|quartus|quintus|sextus|septimus|octavus|nonus|decimus|[IVX]+(\s+et\s+[IVX]+)?|\d+)\b/i);return m?m[0]:o.t}
function repoLinks(w){
  const roman=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  const out=w.tml.map((k,i)=>`<a class="direct" href="${TML_LINK(k)}" target="_blank" rel="noopener">TML${w.tml.length>1?" "+(roman[i]||i+1):""} ↗</a>`);
  const q=w.q;
  out.push(`<a href="https://imslp.org/index.php?search=${enc(q)}" target="_blank" rel="noopener">IMSLP</a>`);
  out.push(`<a href="https://gallica.bnf.fr/services/engine/search/sru?operation=searchRetrieve&version=1.2&query=${enc('(gallica all "'+q+'")')}" target="_blank" rel="noopener">Gallica</a>`);
  out.push(`<a href="https://www.digitale-sammlungen.de/en/search?query=${enc(q)}" target="_blank" rel="noopener">MDZ</a>`);
  out.push(`<a href="https://www.e-rara.ch/search/quick?query=${enc(q)}" target="_blank" rel="noopener">e-rara</a>`);
  if(w.y<1600) out.push(`<a href="https://www.diamm.ac.uk/search/?q=${enc(q)}" target="_blank" rel="noopener">DIAMM</a>`);
  return `<div class="links">${out.join("")}</div>`;
}

/* ---------- passages (lazy) ---------- */
let IDX=null; const DATA={}, LOADING={}; const OPEN=new Set();
fetch("data/index.json").then(r=>r.json()).then(j=>{IDX=j;render()}).catch(()=>{});
function loadCent(c){if(DATA[c]||LOADING[c])return;LOADING[c]=1;fetch("data/"+c+".json").then(r=>r.json()).then(j=>{DATA[c]=j;render()}).catch(()=>{LOADING[c]=0})}
function quotes(key,node){
  const [c,id]=key.split("/"); if(!DATA[c]){loadCent(c);return `<div class="meta">Loading passages…</div>`}
  const q=(DATA[c][id]||{})[node]; if(!q||!q.length) return `<div class="meta">No passage on this topic in this part.</div>`;
  return q.map(([pg,hd,tx])=>`<div class="q"><div class="w"><b>${esc(pg||"—")}</b>${hd?" · "+esc(hd):""}</div><blockquote>${esc(tx)}</blockquote></div>`).join("")+
   `<div class="links"><a class="direct" href="${TML_LINK(key)}" target="_blank" rel="noopener">Read in context ↗</a></div>`;
}
/* nodes of this subtree that have passages in a given TML file */
function hitsIn(key,ids){const h=(IDX||{})[key]||{};return ids.filter(i=>h[i])}
function toggleBtn(k,label){const open=OPEN.has(k);return `<button class="more" data-open="${esc(k)}">${open?"Hide passages":label}</button>`}
function workPassages(wid,nodeIds,tag){
  const w=WORKS[wid]; if(!w||!w.tml.length||!IDX) return "";
  const per=w.tml.map(k=>[k,hitsIn(k,nodeIds)]).filter(x=>x[1].length);
  if(!per.length) return "";
  const k="w|"+wid+"|"+tag, open=OPEN.has(k);
  let body="";
  if(open) body=per.map(([key,ns])=>ns.map(n=>`<div class="loc" style="margin-top:12px">${esc(bookLabel(META[key]||{t:key}))}${n!==tag?" · "+esc(NODES[n].l):""}</div>`+quotes(key,n)).join("")).join("");
  return body+toggleBtn(k,"Latin passages from the text");
}

/* ---------- search ---------- */
const HAY={};
Object.values(NODES).forEach(n=>{
  HAY[n.id]={l:norm(n.l),a:norm(n.a),d:norm(n.d),s:norm(n.s.map(([w,note])=>{const x=WORKS[w]||{};return (x.a||"")+" "+(x.t||"")+" "+note}).join(" "))};
});
function search(q){
  const toks=norm(q).split(/[^a-z0-9]+/).filter(t=>t.length>1); if(!toks.length) return {nodes:[],works:[]};
  const nodes=[];
  Object.entries(HAY).forEach(([id,h])=>{
    let score=0,all=true;
    toks.forEach(t=>{const s=(h.l.includes(t)?8:0)+(h.a.includes(t)?5:0)+(h.d.includes(t)?2:0)+(h.s.includes(t)?1:0);if(!s)all=false;score+=s});
    if(all) nodes.push([score+(path(id).length===1?1:0),id]);
  });
  nodes.sort((a,b)=>b[0]-a[0]);
  const works=Object.entries(WORKS).filter(([id,w])=>{const h=norm(w.a+" "+w.t+" "+w.p+" "+w.d);return toks.every(t=>h.includes(t))}).sort((a,b)=>a[1].y-b[1].y);
  return {nodes:nodes.slice(0,40).map(x=>x[1]),works:works.slice(0,40)};
}

/* ---------- routing ---------- */
let STATE={q:"",sq:"",cent:"all",kind:"all",lanes:new Set(Object.keys(LANES)),wq:""};
function route(){const h=location.hash.slice(1);
  if(h.startsWith("t-")&&NODES[h.slice(2)]) return {v:"topics",node:h.slice(2)};
  if(h.startsWith("w-")&&WORKS[h.slice(2)]) return {v:"work",work:h.slice(2)};
  if(["treatises","sources","timeline","about"].includes(h)) return {v:h};
  return {v:"topics",node:null};
}
const VIEWS=[["topics","Topics",""],["treatises","Treatises","treatises"],["sources","All TML sources","sources"],["timeline","Timeline","timeline"],["about","About","about"]];

/* ---------- views ---------- */
function topicsView(r){
  let html=`<input type="search" id="q" placeholder="Search any topic, in any language: Oktavregel, sortisatio, diminution 16th century, Quantz…" value="${esc(STATE.q)}">`;
  if(STATE.q.trim().length>1){
    const {nodes,works}=search(STATE.q);
    html+=`<div class="meta">${nodes.length} topics · ${works.length} treatises</div>`;
    html+=`<div class="card">${nodes.map(id=>{const n=NODES[id];return `<a class="res" href="#t-${id}"><div class="p">${path(id).slice(0,-1).map(p=>esc(NODES[p].l)).join(" › ")||"Topic"}</div><b>${esc(n.l)}</b><div class="meta" style="margin:0">${esc(n.d)}</div></a>`}).join("")||"<p>No topic found.</p>"}</div>`;
    if(works.length) html+=`<h3 class="sec">Treatises</h3><div class="card">${works.map(([id,w])=>`<a class="res" href="#w-${id}"><b>${esc(w.a)}</b>, <i>${esc(w.t)}</i><div class="p">${esc(w.d)} · ${esc(w.p)}</div></a>`).join("")}</div>`;
    return html;
  }
  if(!r.node){
    html+=`<p class="lede">Tap a topic to go down the tree; the path stays at the top so you can climb back.</p>`;
    html+=`<div class="tiles">${TREE.map(n=>`<a class="tile" href="#t-${n.id}"><b>${esc(n.l)}</b><span>${countSub(n)} subtopics</span></a>`).join("")}</div>`;
    return html;
  }
  const n=NODES[r.node], p=path(n.id);
  html+=`<div class="crumbs"><a href="#">All topics</a>${p.slice(0,-1).map(id=>`<i>›</i><a href="#t-${id}">${esc(NODES[id].l)}</a>`).join("")}</div>`;
  html+=`<h2>${esc(n.l)}</h2><div class="aka">${esc(n.a)}</div><p class="lede" style="margin-bottom:6px">${esc(n.d)}</p>`;
  if(n.c.length) html+=`<div class="tiles">${n.c.map(c=>`<a class="tile" href="#t-${c.id}"><b>${esc(c.l)}</b><span>${[c.c.length?countSub(c)+" subtopics":"",c.s.length?c.s.length+(c.s.length===1?" source":" sources"):""].filter(Boolean).join(" · ")}</span></a>`).join("")}</div>`;
  const sub=[n.id,...descendants(n.id)];
  if(n.s.length){
    html+=`<h3 class="sec">What the treatises say</h3>`;
    html+=n.s.slice().sort((a,b)=>(WORKS[a[0]].y-WORKS[b[0]].y)).map(([wid,note])=>{const w=WORKS[wid];return `<div class="card">
      <div class="loc">${esc(w.d)} · ${esc(w.p)}</div><h3><a href="#w-${wid}">${esc(w.a)}, <i>${esc(w.t)}</i></a></h3>
      <p class="note">${esc(note)}</p>${workPassages(wid,sub.filter(i=>NODES[i].hasq),n.id)}${repoLinks(w)}</div>`}).join("");
  }
  // sources of the subtopics
  const seen=new Set(n.s.map(x=>x[0])); const below=[];
  descendants(n.id).forEach(id=>NODES[id].s.forEach(([w,note])=>{if(!seen.has(w)){seen.add(w);below.push([w,id,note])}}));
  if(below.length){
    below.sort((a,b)=>WORKS[a[0]].y-WORKS[b[0]].y);
    html+=`<h3 class="sec">${n.s.length?"Also in the subtopics":"Treatises in this branch"}</h3><div class="card">${below.map(([w,id,note])=>`<div class="trow">
      <a href="#w-${w}" style="color:inherit;text-decoration:none"><b>${esc(WORKS[w].a)}</b>, <i>${esc(WORKS[w].t)}</i></a> <span class="meta">${esc(WORKS[w].d)}</span>
      <div class="meta" style="margin:2px 0 0">${esc(note)} → <a href="#t-${id}">${esc(NODES[id].l)}</a></div></div>`).join("")}</div>`;
  }
  html+=tmlList(n,sub);
  return html;
}
function tmlList(n,sub){
  const qids=sub.filter(i=>NODES[i].hasq); if(!qids.length) return "";
  if(!IDX) return `<p class="meta">Loading the Thesaurus…</p>`;
  const cited=new Set(); [n.id,...descendants(n.id)].forEach(id=>NODES[id].s.forEach(([w])=>(WORKS[w]&&WORKS[w].tml||[]).forEach(k=>cited.add(k))));
  const rows=Object.keys(IDX).map(k=>[k,hitsIn(k,qids)]).filter(x=>x[1].length&&!cited.has(x[0]));
  const ord=k=>CENTS.indexOf(k.split("/")[0]);
  rows.sort((a,b)=>ord(a[0])-ord(b[0])||(IDX[b[0]][b[1][0]]-IDX[a[0]][a[1][0]]));
  const LIMIT=STATE["lim-"+n.id]||60; let html="",cur=null;
  rows.slice(0,LIMIT).forEach(([k,ns])=>{const o=META[k];if(!o)return;const c=k.split("/")[0];
    if(c!==cur){cur=c;html+=`<div class="cent">${c} century</div>`}
    const key="t|"+k+"|"+n.id, open=OPEN.has(key);
    html+=`<div class="trow"><div><b>${esc(o.a)}</b> — <i>${esc(o.t)}</i></div>
      <div class="meta" style="margin:2px 0 0">${esc(o.s.replace(/, null\.$/,"."))}</div>
      ${ns.filter(i=>i!==n.id).length?`<div>${ns.filter(i=>i!==n.id).map(i=>`<a class="pill" href="#t-${i}">${esc(NODES[i].l)}</a>`).join("")}</div>`:""}
      ${open?ns.map(i=>(ns.length>1?`<div class="loc" style="margin-top:10px">${esc(NODES[i].l)}</div>`:"")+quotes(k,i)).join(""):""}
      ${toggleBtn(key,"Show passages")}</div>`});
  return `<h3 class="sec">Further texts in the Thesaurus Musicarum Latinarum</h3>
   <p class="meta">${rows.length} texts. Passages are found by the Latin vocabulary of the topic and shown with folio or page and chapter; read them in context to judge them.</p>
   <div class="card">${html||"<p>None found.</p>"}${rows.length>LIMIT?`<button class="more" data-more="${n.id}">Show more (${rows.length-LIMIT})</button>`:""}</div>`;
}
function workView(id){
  const w=WORKS[id], refs=WORKREFS[id]||[];
  let html=`<div class="crumbs"><a href="#treatises">Treatises</a></div><div class="loc">${esc(w.d)} · ${esc(w.p)}</div>
   <h2><i>${esc(w.t)}</i></h2><div class="meta" style="font-size:15px">${esc(w.a)}</div><div class="ctx">${esc(w.ctx)}</div>${repoLinks(w)}`;
  if(refs.length){
    html+=`<h3 class="sec">Topics</h3>`+refs.map(([nid,note])=>`<div class="card"><div class="crumbs" style="margin:0 0 4px">${path(nid).map(p=>`<a href="#t-${p}">${esc(NODES[p].l)}</a>`).join("<i>›</i>")}</div>
      <p class="note">${esc(note)}</p>${workPassages(id,[nid,...descendants(nid)].filter(i=>NODES[i].hasq),nid)}</div>`).join("");
  }
  if(w.tml.length&&IDX){
    const listed=new Set(refs.flatMap(([nid])=>[nid,...descendants(nid)]));
    const other={}; w.tml.forEach(k=>Object.keys(IDX[k]||{}).forEach(nid=>{if(!listed.has(nid))(other[nid]=other[nid]||[]).push(k)}));
    const ks=Object.keys(other);
    if(ks.length) html+=`<h3 class="sec">Further topics found in the text</h3>`+ks.map(nid=>{const key="x|"+id+"|"+nid,open=OPEN.has(key);
      return `<div class="card"><div class="crumbs" style="margin:0">${path(nid).map(p=>`<a href="#t-${p}">${esc(NODES[p].l)}</a>`).join("<i>›</i>")}</div>
       ${open?other[nid].map(k=>`<div class="loc" style="margin-top:10px">${esc(bookLabel(META[k]))}</div>`+quotes(k,nid)).join(""):""}${toggleBtn(key,"Show passages")}</div>`}).join("");
  }
  const conns=CONN.filter(c=>c[0]===id||c[1]===id).map(c=>{const o=c[0]===id?c[1]:c[0];return `<div class="trow"><span class="pill">${esc(c[2])}</span> <a href="#w-${o}">${workLine(o)}</a> — ${esc(c[3])}</div>`}).join("");
  if(conns) html+=`<h3 class="sec">Connections</h3><div class="card">${conns}</div>`;
  const near=CONTEXT.filter(c=>Math.abs(c.y-w.y)<=12).map(c=>`<div class="trow"><span class="lane" style="--c:var(${LANES[c.lane][1]})"></span>${esc(c.date)} · ${esc(c.title)} <span class="meta">— ${esc(c.n)}</span></div>`).join("");
  if(near) html+=`<h3 class="sec">Around the same time</h3><div class="card">${near}</div>`;
  return html;
}
function treatisesView(){
  const q=norm(STATE.wq);
  const list=Object.entries(WORKS).filter(([id,w])=>!q||norm(w.a+" "+w.t+" "+w.p+" "+w.d).includes(q)).sort((a,b)=>a[1].y-b[1].y);
  return `<p class="lede">${Object.keys(WORKS).length} treatises placed in the topic tree, from Augustine to Riemann. Every other TML text is under All TML sources.</p>
   <input type="search" id="wq" placeholder="Search author, title, place…" value="${esc(STATE.wq)}">
   <div class="card">${list.map(([id,w])=>`<a class="res" href="#w-${id}"><div class="p">${esc(w.d)} · ${esc(w.p)}</div><b>${esc(w.a)}</b>, <i>${esc(w.t)}</i>
     <div>${(WORKREFS[id]||[]).slice(0,6).map(([n])=>`<span class="pill">${esc(NODES[n].l)}</span>`).join("")}</div></a>`).join("")}</div>`;
}
function sourcesView(){
  const q=norm(STATE.sq);
  const rows=TML.filter(o=>(STATE.cent==="all"||o.c===STATE.cent)&&(STATE.kind==="all"||o.k===STATE.kind)&&(!q||norm(o.a+" "+o.t+" "+o.s+" "+o.id).includes(q)));
  const workKey=o=>o.a+"|"+o.t.replace(/[,;.]?\s*(liber|book|tractatus|pars)\s+\w+\s*$/i,"").replace(/\s*\[[^\]]*\]\s*$/,"").trim();
  const works=new Map();rows.forEach(o=>{const k=o.c+"|"+workKey(o);if(!works.has(k))works.set(k,[]);works.get(k).push(o)});
  const byAuthor=new Map();works.forEach(v=>{const a=v[0].a;if(!byAuthor.has(a))byAuthor.set(a,[]);byAuthor.get(a).push(v)});
  const cc=["all",...CENTS].map(c=>`<button class="chip ${STATE.cent===c?'on':''}" data-cent="${c}">${c==="all"?"All centuries":c}</button>`).join("");
  const kc=[["all","All"],["text","Printed editions"],["ms","Manuscript transcriptions"]].map(([k,l])=>`<button class="chip ${STATE.kind===k?'on':''}" data-kind="${k}">${l}</button>`).join("");
  let body="";
  [...byAuthor.entries()].slice(0,300).forEach(([a,ws])=>{
    body+=`<div class="card"><h3>${esc(a)}</h3>`+ws.map(v=>{const o=v[0],wid=v.map(x=>FILE2WORK[x.c+"/"+x.id]).find(Boolean);
      const files=v.map(x=>`<a class="${x.k==='ms'?'':'direct'}" href="${TML_LINK(x.c+"/"+x.id)}" target="_blank" rel="noopener">${esc(v.length===1?x.id:bookLabel(x))} ↗</a>`).join("");
      const tops=[...new Set(v.flatMap(x=>Object.keys((IDX||{})[x.c+"/"+x.id]||{})))].slice(0,10);
      return `<div style="margin-top:10px"><div class="loc">${o.c} c.${v.some(x=>x.k==="ms")?" · MS":""}</div>
        <div><i>${esc(workKey(o).split("|")[1]||o.t)}</i>${wid?` · <a href="#w-${wid}">in the tree →</a>`:""}</div>
        <div class="meta" style="margin:2px 0 0">${esc(o.s.replace(/, null\.$/,"."))}</div><div class="links" style="margin-top:6px">${files}</div>
        <div style="margin-top:4px">${tops.map(k=>`<a class="pill" href="#t-${k}">${esc(NODES[k].l)}</a>`).join("")}</div></div>`}).join("")+`</div>`});
  return `<p class="lede">The whole Thesaurus Musicarum Latinarum: ${TML.length} texts from Augustine to the 17th century, each linked to its TML page and tagged with the topics found in it.</p>
  <input type="search" id="sq" placeholder="Search author, title, library, shelfmark…" value="${esc(STATE.sq)}">
  <div class="chips">${cc}</div><div class="chips" style="margin-top:-8px">${kc}</div>
  <p class="meta">${rows.length} texts · ${works.size} works · ${byAuthor.size} authors${byAuthor.size>300?" (first 300 authors shown; narrow the search)":""}</p>${body}
  <p class="meta">TML is being restored at Indiana University; links go to its provisional site for now.</p>`;
}
function timelineView(){
  const lanes=Object.entries(LANES).map(([k,[l,c]])=>`<button class="chip ${STATE.lanes.has(k)?'on':''}" data-lane="${k}"><span class="lane" style="--c:var(${c})"></span>${l}</button>`).join("");
  const items=[...Object.entries(WORKS).map(([id,w])=>({lane:"treatise",y:w.y,date:w.d,title:`<a href="#w-${id}">${esc(w.a)}, <i>${esc(w.t)}</i></a>`,n:w.p})),
    ...CONTEXT.map(c=>({...c,title:esc(c.title),n:c.n}))].filter(i=>STATE.lanes.has(i.lane)).sort((a,b)=>a.y-b.y);
  let html="",cent=null;
  items.forEach(i=>{const c=Math.floor(i.y/100)+1;
    if(c!==cent){cent=c;html+=`<div class="cent" style="margin-left:-18px">${c===1?"1st":c===2?"2nd":c===3?"3rd":c+"th"} century</div>`}
    html+=`<div class="row" style="--c:var(${LANES[i.lane][1]})"><div class="yr">${esc(i.date)}</div><div class="t">${i.title}</div><div class="n">${esc(i.n)}</div></div>`});
  return `<p class="lede">Treatises among manuscripts, prints, science, medicine and events.</p><div class="chips">${lanes}</div><div class="tl">${html}</div>`;
}
function aboutView(){
  const nNodes=Object.keys(NODES).length;
  return `<div class="about"><h2>About Concordantia</h2>
  <p>Concordantia organises music treatises by topic, as a tree you can climb down as far as you need: from Improvisation to Cantare super librum to Sortisatio, or from Basso continuo to National styles to Hamburg and Dresden, 1700–1740.</p>
  <ul>
   <li><b>${nNodes} topics</b>, each with names in several languages, so that the search finds Oktavregel, règle de l'octave and rule of the octave alike.</li>
   <li><b>${Object.keys(WORKS).length} treatises</b> from the 4th to the 19th century, each with where in the work it treats the topic, its context and links to TML, IMSLP, Gallica, MDZ, e-rara and DIAMM.</li>
   <li><b>Latin passages</b> from all ${TML.length} texts of the Thesaurus Musicarum Latinarum, found by each topic's vocabulary and shown with folio or page and chapter. The search is automatic, so a passage can be off the mark; the link to the text in context is the check.</li>
   <li><b>Timeline</b> and <b>connections</b>: dedications, translations, polemics, and what else happened at the time.</li>
  </ul>
  <p class="meta">Summaries and locations are editorial and still being checked against the sources. Corrections are welcome through the feedback button.</p></div>`;
}

/* ---------- render ---------- */
function render(){
  const r=route();
  document.getElementById("nav").innerHTML=VIEWS.map(([v,l,h])=>`<a href="#${h}" class="${(r.v===v||(r.v==="work"&&v==="treatises"))?'on':''}">${l}</a>`).join("");
  const app=document.getElementById("app");
  const html=r.v==="topics"?topicsView(r):r.v==="work"?workView(r.work):r.v==="treatises"?treatisesView():r.v==="sources"?sourcesView():r.v==="timeline"?timelineView():aboutView();
  app.innerHTML=html+`<div class="foot">© 2026 Václav Hřebec · All rights reserved · Online since 15 November 2026 · <a href="../">vaclavhrebec.github.io</a> · <a href="../atlas/">Atlas of Musical Style</a> · <a href="../fiorire/">Fiorire</a> · Texts and images remain with their repositories.</div>`;
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const k=b.dataset.open;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);render()});
  app.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const k="lim-"+b.dataset.more;STATE[k]=(STATE[k]||60)+100;render()});
  app.querySelectorAll("[data-cent]").forEach(b=>b.onclick=()=>{STATE.cent=b.dataset.cent;render()});
  app.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{STATE.kind=b.dataset.kind;render()});
  app.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>{const k=b.dataset.lane;STATE.lanes.has(k)?STATE.lanes.delete(k):STATE.lanes.add(k);render()});
  [["q",250],["sq",300],["wq",150]].forEach(([id,ms])=>{const el=document.getElementById(id);if(!el)return;let tm;
    el.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{STATE[id]=el.value;render();const n=document.getElementById(id);n.focus();n.setSelectionRange(n.value.length,n.value.length)},ms)}});
}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#t-")||location.hash==="")STATE.q="";render();if(location.hash!==lastHash)scrollTo(0,0);lastHash=location.hash});
render();
</script>
