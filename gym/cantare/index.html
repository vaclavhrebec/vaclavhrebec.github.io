<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantare super librum</title>
<meta name="description" content="The ultimate counterpoint gym: chant, mensural melodies and polyphony in historical notation, to sing and improvise against.">
<meta name="theme-color" content="#0f1218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/cantare.css">
</head>
<body>
<header class="bar">
  <button class="ib" id="openLib" aria-label="Library" title="Library"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 6.2l3.7-1 3 13.4-3.7 1z" /></svg><span>Library</span></button>
  <div class="brand"><a href="../" class="back" title="The Ultimate Counterpoint Gym">&larr; Gym</a><h1>Cantare <em>super librum</em></h1><p id="tagline"></p></div>
  <div class="grow"></div>
  <button class="ib" id="toggleTheme" aria-label="Light or dark" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  <button class="ib" id="openStudio" aria-label="Studio" title="Studio"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg><span>Studio</span></button>
</header>

<div class="toolbar" id="toolbar">
  <div class="tb-group"><button class="tbtn" id="editBtn" aria-pressed="false" title="Edit the melody"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20l1-4L16.500 4.500a2.100 2.100 0 0 1 3 3L8 19z"/><path d="M14.500 6.500l3 3"/></svg><span>Edit</span></button></div>
  <div id="editTools" class="edit-tools" hidden></div>
  <span class="sp"></span>
  <div class="tb-group"><button class="tbtn" id="transformBtn" aria-expanded="false" title="Transform the melody"><svg class="ico" viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 12-4.500l2 2"/><path d="M19 4v4.500h-4.500"/><path d="M19 13a7 7 0 0 1-12 4.500l-2-2"/><path d="M5 20v-4.500h4.500"/><path d="M12 10l2 2-2 2-2-2z"/></svg><span>Transform</span></button></div>
  <div class="pop" id="transformPop" hidden></div>
</div>
<div class="shell">
  <aside class="drawer left" id="library" aria-label="Library">
    <div class="drawer-head"><input id="search" type="search" placeholder="Search the library" autocomplete="off"><button class="x" data-close="library" aria-label="Close">&times;</button></div>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="stage" id="stage">
    <section class="piece-head">
      <p class="trail" id="trail"></p>
      <h2 id="title"></h2>
      <p class="note" id="note"></p>
    </section>
    <div class="paper" id="paper" aria-live="polite"></div>
    <nav class="pager" id="pager" hidden><button id="prevLeaf" aria-label="Previous leaf">&lsaquo;</button><span id="leafNo"></span><button id="nextLeaf" aria-label="Next leaf">&rsaquo;</button></nav>
  </main>

  <aside class="drawer right" id="studio" aria-label="Studio">
    <div class="drawer-head"><strong>Studio</strong><button class="x" data-close="studio" aria-label="Close">&times;</button></div>
    <div class="cards" id="cards"></div>
  </aside>
</div>

<footer class="dock" id="dock">
  <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l12-7.5z"/></svg></button>
  <div class="tactus" id="tactusBox" title="Tactus"><svg viewBox="0 0 64 72" id="hand" aria-hidden="true"></svg></div>
  <label class="tempo"><span>Tactus <b id="bpm">52</b></span><input type="range" id="tempo" min="30" max="110" value="52"></label>
  <div class="voices" id="voiceChips"></div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
<script src="../feedback.js" data-topic="Cantare super librum" defer></script>
</body>
</html>
